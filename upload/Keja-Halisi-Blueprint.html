-- Enable pgcrypto for encrypted IDs in Vault
create extension if not exists pgcrypto;

-- ESTATES (geo master)
create table estates (
  id uuid primary key default gen_random_uuid(),
  name text not null, -- Kileleshwa
  sub_county text not null, -- Westlands
  lat double precision,
  lng double precision,
  avg_price text, -- 28k-45k
  verified_count int default 0
);

-- AGENTS
create table agents (
  id uuid primary key default gen_random_uuid(),
  phone text unique not null,
  tiktok_handle text unique not null,
  verification_status text check (verification_status in ('Pending','UnderReview','Verified','Rejected')) default 'Pending',
  badge text check (badge in ('Yellow','Green','Gold','Red')) default 'Yellow',
  id_encrypted text, -- stored in Vault, encrypted
  selfie_url text, -- private bucket only
  created_at timestamptz default now(),
  listings_count int default 0,
  response_rate float default 0,
  reports_count int default 0
);

-- DEVELOPERS
create table developers (
  id uuid primary key default gen_random_uuid(),
  company_name text not null,
  doc_proof text, -- Title/Lease in private bucket
  badge text default 'Gold',
  created_at timestamptz default now()
);

-- LISTINGS
create type listing_status as enum ('Available','Taken','Reserved','Expired');
create type beds_type as enum ('Bedsitter','1BR','2BR','3BR');

create table listings (
  id uuid primary key default gen_random_uuid(),
  agent_id uuid references agents(id) on delete cascade,
  developer_id uuid references developers(id),
  tiktok_url text not null,
  embed_code text, -- oEmbed iframe
  estate text not null,
  sub_county text not null,
  price int not null, -- KES 18000
  deposit int,
  beds beds_type not null,
  status listing_status default 'Available',
  amenities jsonb default '{}'::jsonb,
  lat double precision,
  lng double precision,
  distance_to_road_m int,
  weather_cache jsonb,
  photos text[] default '{}',
  ai_flags jsonb default '{}'::jsonb, -- repost_score, bait_flag
  reports_count int default 0,
  created_at timestamptz default now(),
  expires_at timestamptz default now() + interval '7 days'
);

-- VERIFICATIONS
create table verifications (
  id uuid primary key default gen_random_uuid(),
  agent_id uuid references agents(id),
  doc_type text, -- ID / Selfie / BusinessReg / TitleDeed
  status text default 'Pending',
  reviewed_at timestamptz
);

-- REPORTS
create table reports (
  id uuid primary key default gen_random_uuid(),
  listing_id uuid references listings(id) on delete cascade,
  user_phone text,
  reason text check (reason in ('Taken','FakePrice','ViewingFee','Repost','Other')),
  created_at timestamptz default now()
);

-- LEADS (who viewed whose number)
create table leads (
  id uuid primary key default gen_random_uuid(),
  listing_id uuid references listings(id),
  user_phone text,
  created_at timestamptz default now()
);

-- RLS
alter table estates enable row level security;
alter table agents enable row level security;
alter table listings enable row level security;
alter table reports enable row level security;
alter table leads enable row level security;

-- Public can read verified listings + estates
create policy "public read verified listings"
on listings for select using (status = 'Available');

create policy "public read estates"
on estates for select using (true);

-- Agents can update own listings
create policy "agents update own"
on listings for update using (auth.uid() = agent_id);

-- Agents can insert own listings
create policy "agents insert"
on listings for insert with check (auth.uid() = agent_id);

-- Admin full (service_role bypasses RLS)
-- Reports: anyone can insert, admin reads
create policy "anyone can report"
on reports for insert with check (true);

-- Leads: logged on call click
create policy "log leads"
on leads for insert with check (true);

-- Storage: private buckets for IDs
-- Bucket: verification-docs (private, no public read)
-- Store IDs encrypted via Supabase Vault

-- Auto-expire cron (pg_cron)
-- update listings set status='Expired' where expires_at < now() and status='Available';

-- Auto-hide after 3 reports (trigger)
create or replace function check_reports() returns trigger as $$
begin
  update listings set reports_count = reports_count +1 where id = NEW.listing_id;
  update listings set status='Reserved' where id = NEW.listing_id and reports_count >=3;
  return NEW;
end;
$$ language plpgsql;
create trigger on_report after insert on reports for each row execute function check_reports();
